name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e .

      - name: Quality gate
        run: bash tools/quality-gate.sh

      - name: Build distributions
        run: python -m build

      - name: Verify wheel in isolated environment
        shell: bash
        run: |
          set -euo pipefail

          python -m venv /tmp/vectis-release-smoke
          WHEEL="$(find dist -maxdepth 1 -name 'vectis_lang-*.whl' -print -quit)"
          test -n "$WHEEL"

          /tmp/vectis-release-smoke/bin/python -m pip install "$WHEEL"

          CLI=/tmp/vectis-release-smoke/bin/vectis
          "$CLI" --version
          "$CLI" doctor
          "$CLI" builtins >/dev/null
          "$CLI" capabilities >/dev/null
          "$CLI" --help >/dev/null

          /tmp/vectis-release-smoke/bin/python - <<'PY'
          from importlib.resources import files

          assets = files('vectis').joinpath('studio_assets')
          for name in ('index.html', 'styles.css', 'app.js'):
              assert assets.joinpath(name).is_file(), name
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "VECTIS ${TAG}" \
              --generate-notes
          fi
