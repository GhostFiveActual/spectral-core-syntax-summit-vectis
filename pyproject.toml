[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectis-lang"
version = "0.0.1"
description = "Deterministic DSL for readable automation and workflow orchestration"
requires-python = ">=3.11"

[project.scripts]
vectis = "vectis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
